<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:" />
    <title>Vulu Yöneticileri</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div class="kabuk">
        <aside id="yan-menu" class="yan-menu"></aside>

        <main class="icerik">
            <h1 class="h3 mb-3">Vulu Yöneticileri</h1>

            <div class="d-flex gap-2 mb-3">
                <button type="button" id="yeni-dugmesi" class="btn btn-primary">Yönetici kaydı</button>
            </div>

            <p id="liste-hatasi" class="text-danger" hidden></p>

            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Ad soyad</th>
                        <th>Kullanıcı adı</th>
                        <th>Durum</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="satirlar"></tbody>
            </table>

            <p class="small text-secondary">
                Vulu yöneticileri işletme açabilir, askıya alabilir, silebilir ve birbirlerinin hesabını yönetebilir.
                Giriş ekranında işletme kodu olarak <code>vulu</code> yazarlar.
            </p>
        </main>
    </div>

    <div class="modal fade" id="form-penceresi" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="yonetici-formu">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="form-basligi">Vulu yöneticisi kaydı</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body">
                    <label for="v-adsoyad" class="form-label">Ad soyad</label>
                    <input id="v-adsoyad" class="form-control mb-3" autocomplete="off" />

                    <label for="v-ad" class="form-label">Kullanıcı adı</label>
                    <input id="v-ad" class="form-control mb-3" autocomplete="off" />

                    <label for="v-sifre" class="form-label" id="sifre-etiketi">Şifre</label>
                    <input id="v-sifre" type="password" class="form-control mb-3" autocomplete="new-password" />

                    <div class="form-check" id="aktif-kutusu">
                        <input id="v-aktif" type="checkbox" class="form-check-input" />
                        <label for="v-aktif" class="form-check-label">Hesap aktif</label>
                    </div>

                    <p id="form-hatasi" class="text-danger mt-3 mb-0" hidden></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="silme-penceresi" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5">Vulu yöneticisini sil</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body">
                    <p id="silme-metni"></p>
                    <p id="silme-hatasi" class="text-danger mb-0" hidden></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="button" id="sil-dugmesi" class="btn btn-danger">Sil</button>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/kopru.js"></script>
    <script src="js/ortak.js"></script>
    <script src="js/vulu-yoneticiler.js"></script>
</body>
</html>
