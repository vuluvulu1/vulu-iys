# Render Blueprint: API'yi Dockerfile'dan kurar. "sync: false" olan değerler Render panelinden elle girilir.
services:
  - type: web
    name: vulu-tsys-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saglik/canli
    envVars:
      - key: Mongo__BaglantiDizesi
        sync: false
      - key: Mongo__VeritabaniAdi
        value: vulu_platform
      - key: Jwt__Anahtar
        generateValue: true
      - key: IlkAdmin__KullaniciAdi
        value: admin
      - key: IlkAdmin__Sifre
        sync: false
      # API'nin önündeki vekil sayısı. Render'da istek üç vekilden geçer (Cloudflare ve Render'ın kendi katmanları):
      # 1 ile denendiğinde API, istemci yerine Render'ın iç ağ adresini gördü ve başlıkta işlenmemiş iki adres kaldı.
      # Uygulamadaki Sunucu ekranından denetlenir (bkz. README).
      - key: Vekil__AtlamaSayisi
        value: "3"
